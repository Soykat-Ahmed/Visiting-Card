<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .card {
            width: 600px;
            background-color: #1d1d1d;
            color: #fff;
            display: flex;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-left {
            flex: 2;
            padding: 20px;
        }
        .card-left h1 {
            color: #00aaff;
        }
        .card-left p {
            margin: 10px 0;
        }
        .card-right {
            flex: 1;
            background-color: #00aaff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        .qr-code {
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
        }
        .logo {
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
        }
        .logo h2 {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-left">
            <h1>Soykat Ahmed</h1>
            <p>Web developer</p>
            <p>📞 +8801330006032</p>
            <p>✉️ ahmedsoykat31@gmail.com</p>
            <p>📍 Bangladesh, Dhaka, Mirpur-1216</p>
        </div>
        <div class="card-right">
            <div class="logo">
                <h2>Visiting Card</h2>
            </div>
            <div class="qr-code">
                <img src="images/soykatahmed.png" alt="QR Code" width="100">
            </div>
        </div>
    </div>
</body>
</html>
